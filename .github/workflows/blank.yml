name: Unpack backup.zip

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'backup.zip'

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unpack backup.zip and check for large files
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [ ! -f "backup.zip" ]; then
            echo "ERROR: backup.zip not found in repository root. Exiting."
            exit 1
          fi

          # Unzip into repository root excluding any workflow files to avoid overwriting workflows
          unzip -o backup.zip -x ".github/*" -d .

          # Search for files larger than 100MB (skip .git and .github)
          BIG_FILE=$(find . -type f -size +100M -not -path "./.git/*" -not -path "./.github/*" | head -n 1 || true)
          if [ -n "$BIG_FILE" ]; then
            echo "ERROR: Found file(s) >100MB (GitHub will reject these). Example: $BIG_FILE"
            echo "Options: (1) remove or move these files, (2) use Git LFS, or (3) update workflow to skip/handle them."
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack backup.zip (automated)"
            git push
          fi
