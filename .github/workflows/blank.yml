  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Unpack backup.zip and commit files
    env:
      GITHUB_WORKSPACE: ${{ github.workspace }}
    run: |
      set -e
      if [ ! -f "backup.zip" ]; then
        echo "backup.zip not found in repository root. Exiting.";
        exit 1;
      fi
      # Unzip into repository root excluding any workflow files to avoid overwriting this workflow
      unzip -o backup.zip -x ".github/*" -d .

      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

      git add -A
      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "Unpack backup.zip (automated)"
        git push
      fi
